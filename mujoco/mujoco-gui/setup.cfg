[metadata]
name = mujoco-runtime-control
version = 2.1.0
description = Reusable MuJoCo browser control, terrain composition and sim-to-sim tools
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.8
packages = find:
package_dir =
    = src
install_requires =
    mujoco>=2.3
    numpy>=1.20
    Pillow>=8
    onnxruntime>=1.14
    PyYAML>=6
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
keyboard =
    evdev>=1.6; platform_system == "Linux"
test =
    pytest>=7

[options.entry_points]
console_scripts =
    mujoco-scene-editor = runtime_control.scene_editor:main
    mujoco-urdf-to-mjcf = runtime_control.urdf_converter:main
    mujoco-urdf-converter-gui = runtime_control.urdf_gui:main
    mujoco-mjcf-viewer = runtime_control.mjcf_viewer:main

[options.package_data]
runtime_control =
    example_runtime_config.yaml
    maps/*.xml
    maps/*.txt
    maps/*.md
    maps/*.py
    maps/imgs/*.png
    maps/barkour_assets/*.stl
    maps/barkour_assets/*.png
    demo/*.py
    demo/*.yaml
    demo/*.onnx
    demo/dog/xml/*.xml
    demo/dog/meshes/*.STL
