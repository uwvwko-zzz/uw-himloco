# 仿真时长
simulation_duration: 60.0
# 仿真步长时间  
simulation_dt: 0.005  # Isaac Gym 默认 dt=0.005
# 多少仿真步进行一次推理
control_decimation: 4  # Isaac Gym 默认 decimation=4

# PD控制器参数（必须匹配 Isaac Gym）
kps: [20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20]  # stiffness = 20.0
kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]  # damping = 0.5

# 默认关节角度（与 Isaac Gym 一致）
default_angles: [
  0.1, 0.8, -1.5,   # FL
  -0.1, 0.8, -1.5,  # FR
  0.1, 1.0, -1.5,   # RL  
  -0.1, 1.0, -1.5   # RR
]

# 观测/动作的缩放因子（必须匹配 Isaac Gym）
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25  
cmd_scale: [2.0, 2.0, 0.25, 0.0]  # lin_x, lin_y, ang_z, heading

# 策略输入输出维度
num_actions: 12
num_obs: 45

# 初始运动指令
cmd_init: [0.0, 0.0, 0.0]